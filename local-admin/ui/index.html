<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ellis · 本地内容管理</title><link rel="stylesheet" href="/admin/admin.css"><script defer src="/admin/editor.js"></script></head><body>
<header class="top"><a class="brand" href="/admin/">ELLIS <span>本地内容管理</span></a><span class="local">仅在本机运行</span><button id="package" class="primary" disabled data-initialize>生成上传包</button></header>
<div class="workspace"><aside class="sidebar"><label for="page-search">查找页面</label><div class="search"><input id="page-search" type="search" placeholder="页面标题或网址"><button id="clear-pages" aria-label="清空页面搜索" disabled data-initialize>×</button></div><nav id="pages" aria-label="页面列表"></nav></aside>
<main><div id="status" role="status" aria-live="polite">正在读取本地内容…</div><section class="page-heading"><div><p id="category" class="eyebrow">中文编辑</p><h1 id="page-title">选择页面</h1><p id="page-route"></p></div><div class="actions"><a id="preview-zh" target="_blank" rel="noopener">中文预览 ↗</a><a id="preview-en" target="_blank" rel="noopener">英文预览 ↗</a></div></section>
<div class="workflow"><strong id="pending-count">英文同步状态</strong><span>修改中文并保存后，告诉 Codex“我改好了”，由它同步英文并检查上传包。</span></div>
<div class="toolbar"><div class="search"><input id="field-search" type="search" aria-label="搜索本页内容" placeholder="搜索本页文字"><button id="clear-fields" aria-label="清空内容搜索" disabled data-initialize>×</button></div><label><input id="pending-only" type="checkbox"> 只看待同步</label><button id="history-button" disabled data-initialize>修改记录</button><button id="refresh" disabled data-initialize>刷新</button></div>
<p id="range" class="muted"></p><section id="fields" aria-label="可编辑内容"></section><div class="pagination"><button id="previous" disabled data-initialize>上一页</button><span id="page-number"></span><button id="next" disabled data-initialize>下一页</button></div>
</main></div>
<dialog id="edit-dialog" aria-labelledby="edit-title"><form id="edit-form" novalidate><div class="dialog-top"><div><p id="edit-section" class="eyebrow"></p><h2 id="edit-title">修改中文</h2></div><button type="button" data-close aria-label="关闭编辑窗口" disabled data-initialize>×</button></div><p id="shared-note" class="notice" hidden></p><label for="edit-zh">中文内容</label><textarea id="edit-zh" class="resize-none" aria-describedby="edit-error" rows="7"></textarea><div id="upload-wrap" hidden><label for="upload">选择新图片（PNG/JPEG/WebP，上限 10 MB）</label><input id="upload" type="file" accept="image/png,image/jpeg,image/webp"><img id="image-preview" alt="所选图片预览"></div><details><summary>查看当前英文和原始中文</summary><h3>当前英文</h3><p id="edit-en" class="source"></p><h3>原始中文</h3><p id="edit-original" class="source"></p></details><p id="edit-error" role="alert"></p><div class="dialog-actions"><button type="button" data-close disabled data-initialize>取消</button><button id="save" class="primary" type="submit">保存中文草稿</button></div></form></dialog>
<dialog id="history-dialog" aria-labelledby="history-title"><div class="dialog-top"><h2 id="history-title">修改记录</h2><button data-close aria-label="关闭修改记录" disabled data-initialize>×</button></div><p>恢复会新增一个版本，现有历史记录会保留。</p><div id="history"></div></dialog>
<dialog id="confirm-dialog" aria-labelledby="confirm-title"><h2 id="confirm-title">放弃尚未保存的修改？</h2><p>已保存的草稿不受影响。</p><div class="dialog-actions"><button id="keep-editing" disabled data-initialize>继续编辑</button><button id="discard" disabled data-initialize>放弃修改</button></div></dialog>
</body></html>
